# Exemplo de configuração do fungusfix.
# Copie para "fungusfix.toml" (na pasta onde você roda o programa) ou passe com --config.
# Tudo é opcional: o que não aparecer aqui fica com o padrão. Opções da linha de comando
# têm prioridade sobre este arquivo, e os blocos [[foto]] têm prioridade sobre tudo.

# Ponto de partida: "padrao", "suave" (70% da correção, teto menor) ou "maximo".
preset = "padrao"

[geral]
teto_ganho = 0.4        # quanto um pixel pode clarear no máximo, em log (0.4 ≈ +49%)
# metodo = "hybrid"     # "hybrid" (recomendado), "flatfield" ou "inpaint"

[teia]                  # os filamentos do fungo
forca = 1.0             # 0 = não corrige, 0.5 = metade, 1 = completa (até 2)
desfoque = "auto"       # "auto" (medido pela abertura e pela foto) ou um número (px de análise)
paredes_escuras = false # true: mede melhor paredes escuras sob lâmpada (desconta o ruído do sensor)

[mancha]                # a mancha marrom / ponto branco no zoom mínimo
forca = 1.0
ajuste_final = true     # acerto fino da mancha contra a vizinhança
teto = false            # false = sem teto; ex. 1.0 evita pontos claros em faixas sombreadas

[pixels_quentes]
corrigir = true

# Ajustes só para algumas fotos (padrão de nome, como no terminal: * e ?).
# [[foto]]
# arquivos = "IMG_313*"
# teia = { forca = 0.8 }
# mancha = { teto = 1.0 }
